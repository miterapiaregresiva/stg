name: RED BICA daily availability

on:
  push:
    paths:
      - 'scripts/refresh_bica_availability.py'
      - 'data/bica/*-records.json'
      - 'data/bica/library-contacts.json'
      - '.github/workflows/bica-daily-refresh.yml'
  schedule:
    # 05:15 UTC = 05:15/06:15 en Canarias según horario de invierno/verano.
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: red-bica-daily-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3

      - name: Refresh public RED BICA availability
        run: python scripts/refresh_bica_availability.py

      - name: Commit changed availability data
        shell: bash
        run: |
          if git diff --quiet -- data/availability data/library data/books/lazos-de-amor.json; then
            echo "No availability changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/availability data/library data/books/lazos-de-amor.json
          git commit -m "Update RED BICA daily availability"
          git pull --rebase origin main
          git push origin HEAD:main
