name: Normalize favicons

on:
  push:
    paths:
      - '.github/workflows/normalize-favicons.yml'
      - '**/*.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: favicon-normalization
  cancel-in-progress: true

jobs:
  favicons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate favicon assets
        run: |
          convert assets/images/branding/miterapiaregresiva-equipo-identidad-logo-principal-1024x1024.png -resize 192x192 assets/icons/miterapiaregresiva-equipo-icono-aplicacion-192x192.png
          convert assets/images/branding/miterapiaregresiva-equipo-identidad-logo-principal-1024x1024.png -resize 512x512 assets/icons/miterapiaregresiva-equipo-icono-aplicacion-512x512.png

      - name: Write manifest
        run: |
          cat > assets/icons/site.webmanifest <<'EOF'
          {
            "name": "Mi Terapia Regresiva",
            "short_name": "Mi Terapia Regresiva",
            "icons": [
              {"src": "miterapiaregresiva-equipo-icono-aplicacion-192x192.png", "sizes": "192x192", "type": "image/png"},
              {"src": "miterapiaregresiva-equipo-icono-aplicacion-512x512.png", "sizes": "512x512", "type": "image/png"}
            ],
            "theme_color": "#6b3f78",
            "background_color": "#fbf9fc",
            "display": "standalone"
          }
          EOF

      - name: Normalize HTML favicon links
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'assets/icons/favicon.ico': 'assets/icons/miterapiaregresiva-equipo-icono-favicon-16x16.ico',
              'assets/icons/favicon-32x32.png': 'assets/icons/miterapiaregresiva-equipo-icono-favicon-32x32.png',
              'assets/icons/favicon-16x16.png': 'assets/icons/miterapiaregresiva-equipo-icono-favicon-16x16.png',
              'assets/icons/apple-touch-icon.png': 'assets/icons/miterapiaregresiva-equipo-icono-apple-touch-180x180.png',
          }
          for p in Path('.').rglob('*.html'):
              text = p.read_text(encoding='utf-8')
              normalized = text
              for old, new in replacements.items():
                  normalized = normalized.replace(old, new)
              if normalized != text:
                  p.write_text(normalized, encoding='utf-8')
          PY

      - name: Commit favicon normalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/icons '*.html' '**/*.html'
          if git diff --cached --quiet; then
            echo 'No favicon changes to commit.'
          else
            git commit -m 'Sprint 3: normalize favicons across site'
            git pull --rebase origin main
            git push origin main
          fi
